<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Rental Product | Moupriya</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f8f5f6}.brand{color:#762d46;font-family:Georgia,serif}.thumb{width:100px;height:100px;object-fit:cover;border-radius:12px}</style></head><body><main class="container py-5"><div class="card border-0 shadow-sm p-4 mx-auto" style="max-width:900px"><h1 class="brand h3">Edit rental product</h1><p class="text-secondary">{{ product.code }} · {{ product.name }}</p><form method="post" action="{{ url_for('rental_product_save') }}" enctype="multipart/form-data"><input type="hidden" name="product_id" value="{{ product.id }}"><div class="row g-3"><div class="col-md-4"><label class="form-label">Product code *</label><input class="form-control" name="code" value="{{ product.code }}" required></div><div class="col-md-8"><label class="form-label">Product name *</label><input class="form-control" name="name" value="{{ product.name }}" required></div><div class="col-md-4"><label class="form-label">Category *</label><input class="form-control" name="category" value="{{ product.category }}" required></div><div class="col-md-4"><label class="form-label">Rental price (₹)</label><input class="form-control" type="number" min="0" step="0.01" name="rental_price" value="{{ product.rental_price }}" required></div><div class="col-md-4"><label class="form-label">Refundable deposit (₹)</label><input class="form-control" type="number" min="0" step="0.01" name="refundable_deposit" value="{{ product.refundable_deposit }}"></div><div class="col-md-4"><label class="form-label">Rental days</label><input class="form-control" type="number" min="1" name="rental_days" value="{{ product.rental_days }}"></div><div class="col-md-8"><label class="form-label">Size details</label><input class="form-control" name="size_details" value="{{ product.size_details or '' }}"></div><div class="col-md-8"><label class="form-label">Add more photographs</label><input class="form-control" type="file" name="images" accept="image/jpeg,image/png,image/webp" multiple><div class="form-text">Multiple selection supported. Images are resized and converted to WebP before Cloudinary upload.</div></div><div class="col-md-4"><label class="form-label">Product badge</label><select class="form-select" name="badge"><option value="">No badge</option>{% for b in ['Just Arrived','New Item','Fast Moving','Popular','Party Choice','Wedding Choice','Puja Choice','Photoshoot','Audition','Dance','Puja Wear','Hot'] %}<option {% if product.badge==b %}selected{% endif %}>{{ b }}</option>{% endfor %}</select></div><div class="col-12"><div class="d-flex flex-wrap gap-2">{% for image in product.gallery_urls %}<img class="thumb" src="{{ image }}" alt="Product photo">{% endfor %}</div></div><div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status"><option {% if product.status=='Active' %}selected{% endif %}>Active</option><option {% if product.status=='Archived' %}selected{% endif %}>Archived</option></select></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="4" name="description">{{ product.description or '' }}</textarea></div></div><div id="uploadProgressWrap" class="d-none mt-3"><div class="d-flex justify-content-between small mb-1"><span id="uploadStatus">Preparing images…</span><span id="uploadPercent">0%</span></div><div class="progress" style="height:12px"><div id="uploadProgress" class="progress-bar progress-bar-striped progress-bar-animated" style="width:0%;transition:width 1.2s ease"></div></div></div><div class="mt-4"><button id="saveProductBtn" class="btn btn-dark">Save changes</button> <a class="btn btn-outline-secondary" href="{{ url_for('rental_admin_dashboard') }}">Cancel</a></div></form></div></main><script>const form=document.querySelector('form');form.addEventListener('submit',e=>{e.preventDefault();const wrap=document.getElementById('uploadProgressWrap'),bar=document.getElementById('uploadProgress'),pct=document.getElementById('uploadPercent'),status=document.getElementById('uploadStatus'),btn=document.getElementById('saveProductBtn');wrap.classList.remove('d-none');btn.disabled=true;const xhr=new XMLHttpRequest();xhr.open('POST',form.action);xhr.upload.onprogress=e=>{if(e.lengthComputable){let n=Math.round(e.loaded/e.total*100);bar.style.width=n+'%';pct.textContent=n+'%';status.textContent='Uploading and preparing images…';}};xhr.onload=()=>{bar.style.width='100%';pct.textContent='100%';status.textContent='Saved. Refreshing…';window.location.href=xhr.responseURL||'{{ url_for('rental_admin_dashboard') }}';};xhr.onerror=()=>{status.textContent='Upload failed. Please retry.';btn.disabled=false;};xhr.send(new FormData(form));});</script></body></html>
